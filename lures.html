<title>Fishing Lure Guide</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0f4f8; }
  header { background: #1a3a50; padding: 16px 20px; text-align: center; }
  header h1 { font-size: 22px; font-weight: 900; color: #fff; }
  header p { font-size: 12px; color: #7aadbe; margin-top: 3px; }
  .lure-card { background: #fff; margin-bottom: 10px; }
  .lure-img-box {
    width: 100%; background: #fff; display: flex; align-items: center;
    justify-content: center; padding: 32px 24px 24px; min-height: 200px;
  }
  .lure-img-box svg { width: 100%; max-width: 380px; height: auto; display: block; }
  .lure-label {
    background: #fff; padding: 13px 16px 15px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #e8eef3; border-bottom: 2px solid #e8eef3; cursor: pointer;
  }
  .lure-label h2 { font-size: 21px; font-weight: 900; color: #000; }
  .lure-label p { font-size: 12px; color: #5a7a8a; margin-top: 3px; }
  .chevron { font-size: 18px; color: #1a3a50; transition: transform .25s; flex-shrink: 0; margin-left: 12px; }
  .lure-card.open .chevron { transform: rotate(180deg); }
  .lure-detail { display: none; background: #f7fafc; border-top: 3px solid #1a3a50; padding: 18px 16px 24px; }
  .lure-card.open .lure-detail { display: block; }
  .video-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #ff0000; color: #fff; font-size: 15px; font-weight: 800;
    text-decoration: none; border-radius: 10px; padding: 14px 20px; margin-bottom: 20px;
  }
  .section { margin-bottom: 16px; }
  .section h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; color: #1a3a50; margin-bottom: 8px; }
  .section p, .section li { font-size: 14px; color: #334; line-height: 1.65; }
  .steps { counter-reset: s; list-style: none; padding: 0; }
  .steps li { counter-increment: s; display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
  .steps li::before { content: counter(s); background: #1a3a50; color: #fff; font-weight: 800; font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .tag.fish { background: #fff3e0; color: #b45309; border: 1px solid #f5c88a; }
  .tag.season { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .tip { background: #e8f5e9; border-left: 4px solid #2e7d32; border-radius: 6px; padding: 11px 14px; font-size: 13px; color: #1b4d1e; line-height: 1.6; }
</style>
</head>

function build() {
  const wrap = document.getElementById("cards");
  LURES.forEach(lure => {
    const card = document.createElement("div");
    card.className = "lure-card";
    card.innerHTML = `
      <div class="lure-img-box">${lure.svg}</div>
      <div class="lure-label">
        <div><h2>${lure.name}</h2><p>${lure.tagline}</p></div>
        <span class="chevron">&#9660;</span>
      </div>
      <div class="lure-detail">
        <a class="video-btn" href="${lure.video}" target="_blank" rel="noopener">&#9654;&nbsp; Watch How To Fish It on YouTube</a>
        <div class="section"><h3>Target Fish</h3><div class="tags">${lure.target.map(f=>`<span class="tag fish">${f}</span>`).join("")}</div></div>
        <div class="section"><h3>Best Seasons</h3><div class="tags">${lure.season.map(s=>`<span class="tag season">${s}</span>`).join("")}</div></div>
        <div class="section"><h3>Depth</h3><p>${lure.depth}</p></div>
        <div class="section"><h3>How To Fish It</h3><ul class="steps">${lure.steps.map(s=>`<li>${s}</li>`).join("")}</ul></div>
        <div class="section"><div class="tip">&#128161; <strong>Pro Tip:</strong> ${lure.tip}</div></div>
      </div>`;
    card.querySelector(".lure-label").addEventListener("click", () => {
      const isOpen = card.classList.contains("open");
      document.querySelectorAll(".lure-card.open").forEach(c => c.classList.remove("open"));
      if (!isOpen) { card.classList.add("open"); setTimeout(()=>card.scrollIntoView({behavior:"smooth",block:"start"}),10); }
    });
    wrap.appendChild(card);
  });
}
build();
