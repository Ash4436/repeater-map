<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repeater Map – Northeast Ohio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 13px; display: flex; height: 100vh; overflow: hidden; background: #1a1a2e; color: #e0e0e0; }

  /* SIDEBAR */
  #sidebar { width: 320px; min-width: 220px; max-width: 420px; display: flex; flex-direction: column; background: #16213e; border-right: 1px solid #0f3460; overflow: hidden; }
  #sidebar-header { padding: 10px 12px 6px; background: #0f3460; flex-shrink: 0; }
  #sidebar-header h1 { font-size: 15px; font-weight: 700; color: #e94560; letter-spacing: 0.5px; }
  #sidebar-header p { font-size: 11px; color: #8899aa; margin-top: 2px; }

  /* FILTER BAR */
  #filter-bar { padding: 8px 12px; background: #0d1b2a; border-bottom: 1px solid #0f3460; flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .band-toggle { padding: 3px 10px; border-radius: 12px; border: 1px solid #444; cursor: pointer; font-size: 11px; font-weight: 600; background: #1a1a2e; color: #aaa; transition: all .15s; user-select: none; }
  .band-toggle.active { border-color: transparent; color: #fff; }
  .band-toggle[data-band="2m"].active  { background: #2563eb; }
  .band-toggle[data-band="70cm"].active { background: #7c3aed; }
  .band-toggle[data-band="gmrs"].active { background: #059669; }
  .sel-btns { display: flex; gap: 4px; margin-left: auto; }
  .sel-btns button { font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid #444; background: #1a1a2e; color: #aaa; cursor: pointer; }
  .sel-btns button:hover { border-color: #e94560; color: #e94560; }

  /* CHANNEL LIST */
  #channel-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  #channel-list::-webkit-scrollbar { width: 6px; }
  #channel-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .area-group { margin-bottom: 2px; }
  .area-header { padding: 5px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #8899aa; background: #0d1b2a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
  .area-header:hover { color: #e0e0e0; }
  .area-header .area-count { font-weight: 400; font-size: 10px; color: #556; }
  .area-header .chevron { transition: transform .2s; }
  .area-header.collapsed .chevron { transform: rotate(-90deg); }

  .channel-item { display: flex; align-items: center; padding: 5px 12px 5px 16px; border-bottom: 1px solid #0d1b2a; cursor: pointer; transition: background .1s; }
  .channel-item:hover { background: #1e2d45; }
  .channel-item.hidden-band { display: none; }
  .channel-item input[type=checkbox] { margin-right: 8px; flex-shrink: 0; accent-color: #e94560; }
  .channel-info { flex: 1; min-width: 0; }
  .channel-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-freq { font-size: 11px; color: #8899aa; }
  .band-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: 6px; }

  /* ACTION BAR */
  #action-bar { padding: 10px 12px; background: #0f3460; flex-shrink: 0; display: flex; gap: 8px; }
  #export-btn { flex: 1; padding: 8px; background: #e94560; border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s; }
  #export-btn:hover { background: #c73652; }
  #selected-count { font-size: 11px; color: #8899aa; align-self: center; white-space: nowrap; }

  /* MAP */
  #map { flex: 1; }

  /* LEGEND */
  .legend { background: rgba(22,33,62,0.92); border: 1px solid #0f3460; border-radius: 6px; padding: 8px 12px; font-size: 11px; }
  .legend h4 { font-size: 11px; font-weight: 700; color: #8899aa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.3); }

  /* POPUP */
  .leaflet-popup-content-wrapper { background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 8px; }
  .leaflet-popup-tip { background: #16213e; }
  .popup-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .popup-row { display: flex; gap: 8px; margin: 2px 0; font-size: 12px; color: #aab; }
  .popup-label { color: #667; min-width: 50px; }
  .popup-val { color: #dde; font-weight: 500; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📡 Repeater Map</h1>
    <p>Northeast Ohio &amp; Mid-Ohio</p>
  </div>

  <div id="filter-bar">
    <span class="band-toggle active" data-band="2m">2m</span>
    <span class="band-toggle active" data-band="70cm">70cm</span>
    <span class="band-toggle active" data-band="gmrs">GMRS</span>
    <div class="sel-btns">
      <button id="select-all">All</button>
      <button id="select-none">None</button>
    </div>
  </div>

  <div id="channel-list"></div>

  <div id="action-bar">
    <button id="export-btn">⬇ Download CHIRP CSV</button>
    <span id="selected-count">0 selected</span>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
// Fields: name, freq, offset (MHz, signed), tone, ctcss (rx tone or ""), band, area, comment
// duplex: '+' | '-' | '' | 'off' | 'split'
const REPEATERS = [
  // ── Cuyahoga Falls ──
  { name:"W8BI",    freq:147.015, offset:+0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Cuyahoga Falls", comment:"W8BI 147.015 Cuyahoga Falls" },
  { name:"K8CFN",   freq:146.670, offset:-0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Cuyahoga Falls", comment:"K8CFN 146.670 Cuyahoga Falls" },
  { name:"WD8IEL",  freq:444.850, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Cuyahoga Falls", comment:"WD8IEL 444.850 Cuyahoga Falls" },

  // ── Akron ──
  { name:"W8RU",    freq:146.760, offset:-0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Akron", comment:"W8RU Akron" },
  { name:"K8AK",    freq:147.195, offset:+0.600, tone:141.3, ctcss:"",    band:"2m",   area:"Akron", comment:"K8AK Akron" },
  { name:"WA8YRS",  freq:443.625, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Akron", comment:"WA8YRS 443.625 Akron" },

  // ── Tallmadge ──
  { name:"N8SY",    freq:147.045, offset:+0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Tallmadge", comment:"N8SY Tallmadge" },
  { name:"KD8WYO",  freq:444.425, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Tallmadge", comment:"KD8WYO Tallmadge" },

  // ── Summit County ──
  { name:"WB8OHV",  freq:145.350, offset:-0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Summit County", comment:"WB8OHV Summit Co." },
  { name:"K8BTU",   freq:147.375, offset:+0.600, tone:131.8, ctcss:"",    band:"2m",   area:"Summit County", comment:"K8BTU Summit Co." },
  { name:"WA8ZNC",  freq:442.550, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Summit County", comment:"WA8ZNC Summit Co." },

  // ── Medina County ──
  { name:"N8JXQ",   freq:146.910, offset:-0.600, tone:110.9, ctcss:"",    band:"2m",   area:"Medina County", comment:"N8JXQ Medina Co." },
  { name:"KD8YBQ",  freq:443.150, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Medina County", comment:"KD8YBQ Medina Co." },

  // ── Mid-Ohio ──
  { name:"K8MO",    freq:146.625, offset:-0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Mid-Ohio", comment:"K8MO Mid-Ohio" },
  { name:"WB8YGY",  freq:145.410, offset:-0.600, tone:127.3, ctcss:"",    band:"2m",   area:"Mid-Ohio", comment:"WB8YGY Mid-Ohio" },
  { name:"WB8YGY",  freq:444.100, offset:+5.000, tone:127.3, ctcss:"",    band:"70cm", area:"Mid-Ohio", comment:"WB8YGY 70cm Mid-Ohio" },

  // ── Ashland ──
  { name:"K8ASH",   freq:146.700, offset:-0.600, tone:100.0, ctcss:"",    band:"2m",   area:"Ashland", comment:"K8ASH Ashland" },
  { name:"W8ASH",   freq:443.500, offset:+5.000, tone:100.0, ctcss:"",    band:"70cm", area:"Ashland", comment:"W8ASH 70cm Ashland" },

  // ── GMRS ──
  { name:"GMRS-16", freq:462.550, offset:+5.000, tone:141.3, ctcss:"141.3", band:"gmrs", area:"Cuyahoga Falls", comment:"GMRS Ch16 NE Ohio" },
  { name:"GMRS-20", freq:462.650, offset:+5.000, tone:100.0, ctcss:"100.0", band:"gmrs", area:"Akron",           comment:"GMRS Ch20 Akron" },
  { name:"GMRS-22", freq:462.725, offset:+5.000, tone:100.0, ctcss:"100.0", band:"gmrs", area:"Summit County",   comment:"GMRS Ch22 Summit" },
];

// Area → approximate center lat/lng
const AREA_COORDS = {
  "Cuyahoga Falls": [41.1339, -81.4846],
  "Akron":          [41.0814, -81.5190],
  "Tallmadge":      [41.1017, -81.4340],
  "Summit County":  [41.1280, -81.5640],
  "Medina County":  [41.1387, -81.8637],
  "Mid-Ohio":       [40.7936, -82.0131],
  "Ashland":        [40.8687, -82.3179],
};

const BAND_COLOR = { "2m": "#3b82f6", "70cm": "#8b5cf6", "gmrs": "#10b981" };
const DEFAULT_TONE = 88.5;

// ─── MAP SETUP ───────────────────────────────────────────────────────────────
const map = L.map("map").setView([41.1339, -81.4846], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// You Are Here marker
const youIcon = L.divIcon({
  className: "",
  html: `<div style="width:16px;height:16px;background:#e94560;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(233,69,96,.7)"></div>`,
  iconSize: [16, 16], iconAnchor: [8, 8],
});

navigator.geolocation?.getCurrentPosition(
  pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    L.marker([lat, lng], { icon: youIcon }).addTo(map)
      .bindPopup("<b>You are here</b>").openPopup();
    map.setView([lat, lng], 11);
  },
  () => {
    L.marker([41.1339, -81.4846], { icon: youIcon }).addTo(map)
      .bindPopup("<b>Default: Cuyahoga Falls, OH</b>");
  }
);

// Legend
const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `<h4>Band</h4>
    <div class="legend-row"><div class="legend-dot" style="background:${BAND_COLOR["2m"]}"></div> 2m (144 MHz)</div>
    <div class="legend-row"><div class="legend-dot" style="background:${BAND_COLOR["70cm"]}"></div> 70cm (440 MHz)</div>
    <div class="legend-row"><div class="legend-dot" style="background:${BAND_COLOR["gmrs"]}"></div> GMRS (462 MHz)</div>
    <hr style="border-color:#0f3460;margin:6px 0">
    <div class="legend-row"><div style="width:12px;height:12px;background:#e94560;border-radius:50%;border:2px solid #fff;flex-shrink:0"></div> You are here</div>`;
  return div;
};
legend.addTo(map);

// ─── MARKERS ─────────────────────────────────────────────────────────────────
function makeIcon(band, selected) {
  const color = BAND_COLOR[band] || "#888";
  return L.divIcon({
    className: "",
    html: `<div style="width:14px;height:14px;background:${color};border:2px solid ${selected?"#e94560":"rgba(255,255,255,0.6)"};border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -8],
  });
}

// Fan out markers at same area coords
const AREA_SLOT = {};
function getSpread(areaKey) {
  if (!AREA_SLOT[areaKey]) AREA_SLOT[areaKey] = 0;
  const idx = AREA_SLOT[areaKey]++;
  const total = REPEATERS.filter(r => r.area === areaKey.split("|")[0]).length;
  const angle = (idx / Math.max(total, 1)) * 2 * Math.PI;
  const radius = total > 1 ? 0.008 : 0;
  const base = AREA_COORDS[areaKey.split("|")[0]] || [41.1, -81.5];
  return [base[0] + radius * Math.sin(angle), base[1] + radius * Math.cos(angle)];
}

// Group repeaters by area, assign marker positions
const markerObjects = [];
REPEATERS.forEach((r, i) => {
  const latlng = getSpread(r.area);
  const marker = L.marker(latlng, { icon: makeIcon(r.band, false) }).addTo(map);
  const sign = r.offset > 0 ? "+" : r.offset < 0 ? "−" : "";
  const offsetStr = r.offset !== 0 ? `${sign}${Math.abs(r.offset).toFixed(3)} MHz` : "Simplex";
  marker.bindPopup(`
    <div class="popup-name">${r.name}</div>
    <div class="popup-row"><span class="popup-label">Freq:</span><span class="popup-val">${r.freq.toFixed(4)} MHz</span></div>
    <div class="popup-row"><span class="popup-label">Offset:</span><span class="popup-val">${offsetStr}</span></div>
    <div class="popup-row"><span class="popup-label">Tone:</span><span class="popup-val">${r.tone} Hz</span></div>
    <div class="popup-row"><span class="popup-label">Band:</span><span class="popup-val">${r.band.toUpperCase()}</span></div>
    <div class="popup-row"><span class="popup-label">Area:</span><span class="popup-val">${r.area}</span></div>
  `);
  markerObjects.push({ marker, index: i });
});

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
const selectedSet = new Set(REPEATERS.map((_, i) => i));
const activeBands = new Set(["2m", "70cm", "gmrs"]);

function updateMarkerStyle(i) {
  const { marker } = markerObjects[i];
  const r = REPEATERS[i];
  const visible = activeBands.has(r.band);
  if (visible) {
    marker.setIcon(makeIcon(r.band, selectedSet.has(i)));
    marker.setOpacity(1);
  } else {
    marker.setOpacity(0);
  }
}

function updateCount() {
  const visible = [...selectedSet].filter(i => activeBands.has(REPEATERS[i].band));
  document.getElementById("selected-count").textContent = `${visible.length} selected`;
}

function buildSidebar() {
  const areas = [...new Set(REPEATERS.map(r => r.area))];
  const list = document.getElementById("channel-list");
  list.innerHTML = "";

  areas.forEach(area => {
    const indices = REPEATERS.map((r, i) => ({ r, i })).filter(({ r }) => r.area === area);
    const group = document.createElement("div");
    group.className = "area-group";

    const header = document.createElement("div");
    header.className = "area-header";
    header.innerHTML = `<span>${area}</span><span class="area-count">${indices.length} ch <span class="chevron">▾</span></span>`;
    let collapsed = false;
    header.addEventListener("click", () => {
      collapsed = !collapsed;
      header.classList.toggle("collapsed", collapsed);
      group.querySelectorAll(".channel-item").forEach(el => el.style.display = collapsed ? "none" : "");
    });
    group.appendChild(header);

    indices.forEach(({ r, i }) => {
      const item = document.createElement("div");
      item.className = `channel-item`;
      item.dataset.band = r.band;
      item.dataset.index = i;
      if (!activeBands.has(r.band)) item.classList.add("hidden-band");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selectedSet.has(i);
      cb.addEventListener("change", e => {
        e.stopPropagation();
        if (cb.checked) selectedSet.add(i); else selectedSet.delete(i);
        updateMarkerStyle(i);
        updateCount();
      });

      const info = document.createElement("div");
      info.className = "channel-info";
      info.innerHTML = `<div class="channel-name">${r.name}</div><div class="channel-freq">${r.freq.toFixed(4)} · ${r.band.toUpperCase()}</div>`;

      const dot = document.createElement("div");
      dot.className = "band-dot";
      dot.style.background = BAND_COLOR[r.band] || "#888";

      item.appendChild(cb);
      item.appendChild(info);
      item.appendChild(dot);
      item.addEventListener("click", e => {
        if (e.target === cb) return;
        map.setView(markerObjects[i].marker.getLatLng(), 13);
        markerObjects[i].marker.openPopup();
      });
      group.appendChild(item);
    });

    list.appendChild(group);
  });
}

// Band toggles
document.querySelectorAll(".band-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const band = btn.dataset.band;
    if (activeBands.has(band)) activeBands.delete(band); else activeBands.add(band);
    btn.classList.toggle("active", activeBands.has(band));
    document.querySelectorAll(`.channel-item[data-band="${band}"]`).forEach(el => {
      el.classList.toggle("hidden-band", !activeBands.has(band));
    });
    REPEATERS.forEach((r, i) => { if (r.band === band) updateMarkerStyle(i); });
    updateCount();
  });
});

// Select all / none
document.getElementById("select-all").addEventListener("click", () => {
  REPEATERS.forEach((r, i) => {
    if (activeBands.has(r.band)) {
      selectedSet.add(i);
      document.querySelector(`.channel-item[data-index="${i}"] input`).checked = true;
    }
    updateMarkerStyle(i);
  });
  updateCount();
});
document.getElementById("select-none").addEventListener("click", () => {
  REPEATERS.forEach((r, i) => {
    if (activeBands.has(r.band)) {
      selectedSet.delete(i);
      document.querySelector(`.channel-item[data-index="${i}"] input`).checked = false;
    }
    updateMarkerStyle(i);
  });
  updateCount();
});

// ─── CHIRP CSV EXPORT ────────────────────────────────────────────────────────
document.getElementById("export-btn").addEventListener("click", () => {
  const HEADER = "Location,Name,Frequency,Duplex,Offset,Tone,rToneFreq,cToneFreq,DtcsCode,DtcsPolarity,RxDtcsCode,CrossMode,Mode,TStep,Skip,Power,Comment,URCALL,RPT1CALL,RPT2CALL,DVCODE";
  const visible = [...selectedSet]
    .filter(i => activeBands.has(REPEATERS[i].band))
    .sort((a, b) => a - b);

  const rows = visible.map((idx, loc) => {
    const r = REPEATERS[idx];
    const freq = r.freq.toFixed(6);

    let duplex, offsetAbs;
    if (r.offset > 0) { duplex = "+"; offsetAbs = r.offset.toFixed(6); }
    else if (r.offset < 0) { duplex = "-"; offsetAbs = Math.abs(r.offset).toFixed(6); }
    else { duplex = ""; offsetAbs = (0).toFixed(6); }

    const toneMode = r.tone && r.tone !== 0 ? "Tone" : "";
    const rTone = (r.tone || DEFAULT_TONE).toFixed(1);
    const cTone = (r.ctcss || r.tone || DEFAULT_TONE).toFixed ? parseFloat(r.ctcss || r.tone || DEFAULT_TONE).toFixed(1) : DEFAULT_TONE.toFixed(1);
    const name = r.name.substring(0, 8).replace(/,/g, "");
    const comment = (r.comment || "").replace(/,/g, ";");

    return [
      loc,          // Location
      name,         // Name
      freq,         // Frequency
      duplex,       // Duplex
      offsetAbs,    // Offset
      toneMode,     // Tone
      rTone,        // rToneFreq
      cTone,        // cToneFreq
      "023",        // DtcsCode
      "NN",         // DtcsPolarity
      "023",        // RxDtcsCode
      "Tone->Tone", // CrossMode
      "FM",         // Mode
      "5.00",       // TStep
      "",           // Skip
      "50W",        // Power
      comment,      // Comment
      "",           // URCALL
      "",           // RPT1CALL
      "",           // RPT2CALL
      "",           // DVCODE
    ].join(",");
  });

  const csv = [HEADER, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "repeaters_chirp.csv";
  a.click();
});

// ─── INIT ────────────────────────────────────────────────────────────────────
buildSidebar();
REPEATERS.forEach((_, i) => updateMarkerStyle(i));
updateCount();
</script>
</body>
</html>
