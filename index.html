<title>Repeater Map – NE Ohio</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 13px; display: flex; height: 100vh; overflow: hidden; background: #1a1a2e; color: #e0e0e0; }

  #sidebar { width: 320px; min-width: 220px; display: flex; flex-direction: column; background: #16213e; border-right: 1px solid #0f3460; overflow: hidden; }
  #sidebar-header { padding: 10px 12px 6px; background: #0f3460; flex-shrink: 0; }
  #sidebar-header h1 { font-size: 15px; font-weight: 700; color: #e94560; }
  #sidebar-header p { font-size: 11px; color: #8899aa; margin-top: 2px; }

  #filter-bar { padding: 7px 10px; background: #0d1b2a; border-bottom: 1px solid #0f3460; flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .band-toggle { padding: 2px 9px; border-radius: 12px; border: 1px solid #444; cursor: pointer; font-size: 11px; font-weight: 600; background: #1a1a2e; color: #666; transition: all .15s; user-select: none; }
  .band-toggle.active { border-color: transparent; color: #fff; }
  .band-toggle[data-band="gmrs"].active   { background: #059669; }
  .band-toggle[data-band="frs"].active    { background: #0891b2; }
  .band-toggle[data-band="2m"].active     { background: #2563eb; }
  .band-toggle[data-band="70cm"].active   { background: #7c3aed; }
  .band-toggle[data-band="other"].active  { background: #b45309; }
  .sel-btns { display: flex; gap: 4px; margin-left: auto; }
  .sel-btns button { font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid #444; background: #1a1a2e; color: #aaa; cursor: pointer; }
  .sel-btns button:hover { border-color: #e94560; color: #e94560; }

  #channel-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  #channel-list::-webkit-scrollbar { width: 5px; }
  #channel-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .area-group { }
  .area-header { padding: 5px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: #7788aa; background: #0d1b2a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
  .area-header:hover { color: #ccd; }
  .area-count { font-weight: 400; }
  .chevron { display: inline-block; transition: transform .2s; }
  .area-header.collapsed .chevron { transform: rotate(-90deg); }

  .channel-item { display: flex; align-items: center; padding: 4px 10px 4px 14px; border-bottom: 1px solid #0d1b2a; cursor: pointer; transition: background .1s; }
  .channel-item:hover { background: #1e2d45; }
  .channel-item.hidden-band { display: none; }
  .channel-item input[type=checkbox] { margin-right: 7px; flex-shrink: 0; accent-color: #e94560; }
  .ch-info { flex: 1; min-width: 0; }
  .ch-name { font-weight: 600; font-size: 12px; }
  .ch-sub  { font-size: 10px; color: #778899; }
  .band-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: 6px; }

  #action-bar { padding: 9px 10px; background: #0f3460; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }
  #export-btn { flex: 1; padding: 7px; background: #e94560; border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  #export-btn:hover { background: #c73652; }
  #selected-count { font-size: 11px; color: #8899aa; white-space: nowrap; }

  #map { flex: 1; }

  .legend { background: rgba(22,33,62,0.93); border: 1px solid #0f3460; border-radius: 6px; padding: 8px 11px; font-size: 11px; line-height: 1.7; }
  .legend h4 { font-size: 10px; font-weight: 700; color: #7788aa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .lr { display: flex; align-items: center; gap: 6px; }
  .ld { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,.25); }

  .leaflet-popup-content-wrapper { background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 8px; }
  .leaflet-popup-tip { background: #16213e; }
  .pu-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .pu-row  { display: flex; gap: 6px; font-size: 11px; margin: 1px 0; }
  .pu-lbl  { color: #667788; min-width: 52px; }
  .pu-val  { color: #ccd; font-weight: 500; }
</style>

// ── Markers ───────────────────────────────────────────────────────────────────
const areaSlot = {};
function spreadLatLng(area) {
  if (!areaSlot[area]) areaSlot[area] = 0;
  const idx = areaSlot[area]++;
  const count = CH.filter(c => c.area === area).length;
  const base = AREA_COORDS[area] || [41.134, -81.485];
  if (count <= 1) return base;
  const angle = (idx / count) * 2 * Math.PI;
  const r = 0.009 + 0.004 * Math.floor(idx / 8);
  return [base[0] + r * Math.sin(angle), base[1] + r * Math.cos(angle)];
}

function makeIcon(band, sel) {
  const c = BAND_COLOR[band] || "#888";
  return L.divIcon({
    className: "",
    html: `<div style="width:13px;height:13px;background:${c};border:2px solid ${sel?"#e94560":"rgba(255,255,255,0.5)"};border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
    iconSize:[13,13], iconAnchor:[6,6], popupAnchor:[0,-8],
  });
}

const markers = CH.map((r, i) => {
  const ll = spreadLatLng(r.area);
  const mk = L.marker(ll, {icon: makeIcon(r.band, false)}).addTo(map);
  const dupStr = r.du === "+" ? `+${r.of.toFixed(3)} MHz` : r.du === "-" ? `-${r.of.toFixed(3)} MHz` : r.du === "split" ? `split ${r.of.toFixed(3)}` : r.du === "off" ? "off" : "simplex";
  mk.bindPopup(`
    <div class="pu-name">${r.n}</div>
    <div class="pu-row"><span class="pu-lbl">Freq:</span><span class="pu-val">${r.f.toFixed(4)} MHz</span></div>
    <div class="pu-row"><span class="pu-lbl">Duplex:</span><span class="pu-val">${dupStr}</span></div>
    <div class="pu-row"><span class="pu-lbl">Tone:</span><span class="pu-val">${r.to||"none"} ${r.to==="Tone"?"tx "+r.rT+" Hz":r.to==="TSQL"?"rx "+r.cT+" Hz":r.to==="DTCS"?"DCS "+r.dc:r.to==="Cross"?r.cr+" "+r.dc:""}</span></div>
    <div class="pu-row"><span class="pu-lbl">Mode:</span><span class="pu-val">${r.mo} · ${r.pw}</span></div>
    <div class="pu-row"><span class="pu-lbl">Area:</span><span class="pu-val">${r.area}</span></div>
  `);
  return mk;
});

// ── Sidebar ───────────────────────────────────────────────────────────────────
const selected = new Set(CH.map((_, i) => i));
const activeBands = new Set(["gmrs","frs","2m","70cm","other"]);

function refreshMarker(i) {
  const vis = activeBands.has(CH[i].band);
  markers[i].setIcon(makeIcon(CH[i].band, selected.has(i)));
  markers[i].setOpacity(vis ? 1 : 0);
}
function refreshCount() {
  const n = [...selected].filter(i => activeBands.has(CH[i].band)).length;
  document.getElementById("selected-count").textContent = `${n} selected`;
}

function buildSidebar() {
  const areas = [...new Set(CH.map(r => r.area))];
  const list = document.getElementById("channel-list");
  list.innerHTML = "";
  areas.forEach(area => {
    const idxs = CH.map((r,i)=>({r,i})).filter(({r})=>r.area===area);
    const grp = document.createElement("div");
    grp.className = "area-group";

    const hdr = document.createElement("div");
    hdr.className = "area-header";
    hdr.innerHTML = `<span>${area}</span><span class="area-count">${idxs.length} <span class="chevron">▾</span></span>`;
    let col = false;
    hdr.addEventListener("click", () => {
      col = !col;
      hdr.classList.toggle("collapsed", col);
      grp.querySelectorAll(".channel-item").forEach(el => el.style.display = col ? "none" : "");
    });
    grp.appendChild(hdr);

    idxs.forEach(({r, i}) => {
      const item = document.createElement("div");
      item.className = "channel-item";
      item.dataset.band = r.band;
      item.dataset.idx = i;
      if (!activeBands.has(r.band)) item.classList.add("hidden-band");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selected.has(i);
      cb.addEventListener("change", e => {
        e.stopPropagation();
        selected[cb.checked ? "add" : "delete"](i);
        refreshMarker(i);
        refreshCount();
      });

      const info = document.createElement("div");
      info.className = "ch-info";
      const toneStr = r.to === "Tone" ? `tx ${r.rT}` : r.to === "TSQL" ? `rx ${r.cT}` : r.to === "DTCS" ? `DCS ${r.dc}` : r.to === "Cross" ? `DCS ${r.dc}` : "no tone";
      info.innerHTML = `<div class="ch-name">${r.n}</div><div class="ch-sub">${r.f.toFixed(4)} · ${toneStr}</div>`;

      const dot = document.createElement("div");
      dot.className = "band-dot";
      dot.style.background = BAND_COLOR[r.band] || "#888";

      item.appendChild(cb);
      item.appendChild(info);
      item.appendChild(dot);
      item.addEventListener("click", e => {
        if (e.target === cb) return;
        map.setView(markers[i].getLatLng(), 13);
        markers[i].openPopup();
      });
      grp.appendChild(item);
    });
    list.appendChild(grp);
  });
}

document.querySelectorAll(".band-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const band = btn.dataset.band;
    activeBands[activeBands.has(band) ? "delete" : "add"](band);
    btn.classList.toggle("active", activeBands.has(band));
    document.querySelectorAll(`.channel-item[data-band="${band}"]`).forEach(el => el.classList.toggle("hidden-band", !activeBands.has(band)));
    CH.forEach((r, i) => { if (r.band === band) refreshMarker(i); });
    refreshCount();
  });
});

document.getElementById("select-all").addEventListener("click", () => {
  CH.forEach((r, i) => { if (activeBands.has(r.band)) { selected.add(i); const el = document.querySelector(`.channel-item[data-idx="${i}"] input`); if(el) el.checked = true; } refreshMarker(i); });
  refreshCount();
});
document.getElementById("select-none").addEventListener("click", () => {
  CH.forEach((r, i) => { if (activeBands.has(r.band)) { selected.delete(i); const el = document.querySelector(`.channel-item[data-idx="${i}"] input`); if(el) el.checked = false; } refreshMarker(i); });
  refreshCount();
});

// ── CHIRP CSV Export ──────────────────────────────────────────────────────────
document.getElementById("export-btn").addEventListener("click", () => {
  const HDR = "Location,Name,Frequency,Duplex,Offset,Tone,rToneFreq,cToneFreq,DtcsCode,DtcsPolarity,RxDtcsCode,CrossMode,Mode,TStep,Skip,Power,Comment,URCALL,RPT1CALL,RPT2CALL,DVCODE";
  const vis = [...selected].filter(i => activeBands.has(CH[i].band)).sort((a,b)=>a-b);
  const rows = vis.map((idx, loc) => {
    const r = CH[idx];
    return [
      loc,
      r.n,
      r.f.toFixed(6),
      r.du,
      r.of.toFixed(6),
      r.to,
      r.rT.toFixed(1),
      r.cT.toFixed(1),
      r.dc,
      r.dtP,
      r.rd,
      r.cr,
      r.mo,
      r.ts,
      "",
      r.pw,
      r.cm,
      "","","",""
    ].join(",");
  });
  const blob = new Blob([[HDR, ...rows].join("\r\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "repeaters_chirp.csv";
  a.click();
});

// ── Init ──────────────────────────────────────────────────────────────────────
buildSidebar();
CH.forEach((_, i) => refreshMarker(i));
refreshCount();
</script>
